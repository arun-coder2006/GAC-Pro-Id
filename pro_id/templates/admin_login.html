<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login - GAC-Pro-I'd
    </title>

    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
           ===================================================== */

        body {

            min-height: 100vh;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #e0f2fe 48%,
                    #f8fbff 100%
                );

            color: #0f172a;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;

            position: relative;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND DECORATION
           ===================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 420px;

            height: 420px;

            top: -180px;

            right: -140px;

            background:
                radial-gradient(
                    circle,
                    rgba(56, 189, 248, 0.22),
                    rgba(37, 99, 235, 0)
                );

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 380px;

            height: 380px;

            bottom: -180px;

            left: -150px;

            background:
                radial-gradient(
                    circle,
                    rgba(37, 99, 235, 0.14),
                    rgba(37, 99, 235, 0)
                );

            pointer-events: none;
        }


        /* =====================================================
           LOGIN WRAPPER
           ===================================================== */

        .login-wrapper {

            width: 100%;

            max-width: 430px;

            position: relative;

            z-index: 2;

            animation:
                pageEnter 0.5s ease-out;
        }


        /* =====================================================
           LOGIN BOX
           ===================================================== */

        .login-box {

            width: 100%;

            background: rgba(
                255,
                255,
                255,
                0.96
            );

            border: 1px solid
                rgba(
                    37,
                    99,
                    235,
                    0.12
                );

            border-radius: 4px;

            padding: 42px 38px 36px;

            box-shadow:
                0 20px 55px
                rgba(
                    15,
                    23,
                    42,
                    0.10
                ),
                0 4px 14px
                rgba(
                    37,
                    99,
                    235,
                    0.06
                );

            position: relative;

            overflow: hidden;
        }


        /* =====================================================
           TOP BLUE ACCENT
           ===================================================== */

        .login-box::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #38bdf8,
                    #2563eb
                );
        }


        /* =====================================================
           LOGIN ICON
           ===================================================== */

        .login-icon {

            width: 58px;

            height: 58px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #38bdf8
                );

            color: white;

            border-radius: 3px;

            font-size: 23px;

            font-weight: 700;

            box-shadow:
                0 8px 20px
                rgba(
                    37,
                    99,
                    235,
                    0.20
                );
        }


        /* =====================================================
           TITLE
           ===================================================== */

        h1 {

            text-align: center;

            color: #0f172a;

            font-size: 27px;

            font-weight: 750;

            letter-spacing: -0.5px;

            margin-bottom: 9px;
        }


        /* =====================================================
           DEPARTMENT
           ===================================================== */

        .department {

            text-align: center;

            color: #2563eb;

            font-size: 14px;

            font-weight: 650;

            margin-bottom: 30px;

            padding-bottom: 22px;

            border-bottom: 1px solid
                #e2e8f0;
        }


        /* =====================================================
           ERROR MESSAGE
           ===================================================== */

        .message {

            margin-bottom: 20px;

            padding: 12px 14px;

            border-left: 3px solid #dc2626;

            background: #fef2f2;

            color: #b91c1c;

            font-size: 13px;

            line-height: 1.5;

            text-align: left;

            border-radius: 2px;
        }


        /* =====================================================
           FORM GROUP
           ===================================================== */

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }


        /* =====================================================
           LABEL
           ===================================================== */

        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.15px;
        }


        /* =====================================================
           INPUT
           ===================================================== */

        input {

            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border: 1px solid #cbd5e1;

            border-radius: 3px;

            background: #ffffff;

            color: #0f172a;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        input::placeholder {

            color: #94a3b8;
        }


        input:hover {

            border-color: #94a3b8;
        }


        input:focus {

            border-color: #2563eb;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }


        input[readonly] {

            background: #f8fafc;

            color: #64748b;

            cursor: default;
        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .login-btn {

            width: 100%;

            height: 50px;

            margin-top: 6px;

            border: none;

            border-radius: 3px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(
                    37,
                    99,
                    235,
                    0.20
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .login-btn:hover {

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb
                );

            transform:
                translateY(-1px);

            box-shadow:
                0 12px 25px
                rgba(
                    37,
                    99,
                    235,
                    0.25
                );
        }


        .login-btn:active {

            transform:
                translateY(0);

            box-shadow:
                0 5px 12px
                rgba(
                    37,
                    99,
                    235,
                    0.18
                );
        }


        /* =====================================================
           BACK LINK
           ===================================================== */

        .back {

            display: flex;

            justify-content: center;

            align-items: center;

            margin-top: 24px;

            color: #475569;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                color 0.2s ease;
        }


        .back:hover {

            color: #2563eb;
        }


        /* =====================================================
           ANIMATION
           ===================================================== */

        @keyframes pageEnter {

            from {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 600px) {

            body {

                padding: 18px;
            }

            .login-box {

                padding:
                    36px 28px 30px;
            }

            h1 {

                font-size: 24px;
            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 420px) {

            body {

                padding: 14px;
            }

            .login-box {

                padding:
                    32px 22px 28px;
            }

            .login-icon {

                width: 52px;

                height: 52px;

                margin-bottom: 18px;

                font-size: 21px;
            }

            h1 {

                font-size: 22px;
            }

            .department {

                margin-bottom: 25px;

                padding-bottom: 19px;
            }

            input {

                height: 46px;
            }

            .login-btn {

                height: 48px;
            }

        }


        /* =====================================================
           REDUCED MOTION
           ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            * {

                scroll-behavior: auto !important;
            }

            .login-wrapper {

                animation: none;
            }

            .login-btn,
            input,
            .back {

                transition: none;
            }
        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="login-box">


        <!-- =================================================
             LOGIN ICON
             ================================================= -->

        <div class="login-icon">

            A

        </div>


        <!-- =================================================
             TITLE
             ================================================= -->

        <h1>
            Admin Login
        </h1>


        <!-- =================================================
             DEPARTMENT
             ================================================= -->

        <div class="department">

            {{ department.name }}

        </div>


        <!-- =================================================
             ADMIN ERROR MESSAGE
             ================================================= -->

        {% if error %}

            <div class="message">

                {{ error }}

            </div>

        {% endif %}


        <!-- =================================================
             ADMIN LOGIN FORM
             ================================================= -->

        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    value="admin"
                    readonly
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                    autocomplete="off"
                >

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
            >

                Login

            </button>


        </form>


        <!-- =================================================
             BACK
             ================================================= -->

        <a
            href="{% url 'department_options' department.id %}"
            class="back"
        >

            ← Back

        </a>


    </div>


</div>


</body>

</html>
