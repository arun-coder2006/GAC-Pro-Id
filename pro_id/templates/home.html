<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GAC-Pro-I'd
    </title>


    <style>

        /* =====================================================
           GLOBAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: #0f172a;

            background:
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eef8ff 50%,
                    #e0f2fe 100%
                );

            overflow-x: hidden;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {

            position: relative;

            width: 100%;

            padding: 58px 20px 62px;

            text-align: center;

            color: #ffffff;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #1d72d8 45%,
                    #38bdf8 100%
                );

            box-shadow:
                0 12px 35px
                rgba(
                    37,
                    99,
                    235,
                    0.18
                );
        }


        /* =====================================================
           HEADER TECHNICAL BACKGROUND
           ===================================================== */

        .header::before {

            content: "";

            position: absolute;

            width: 430px;

            height: 430px;

            top: -280px;

            right: -80px;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.16
                );

            border-radius: 50%;
        }


        .header::after {

            content: "";

            position: absolute;

            width: 330px;

            height: 330px;

            bottom: -250px;

            left: -80px;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.14
                );

            border-radius: 50%;
        }


        /* =====================================================
           HEADER CONTENT
           ===================================================== */

        .header-content {

            position: relative;

            z-index: 2;

            max-width: 900px;

            margin: auto;
        }


        .header h1 {

            margin: 0;

            font-size: 38px;

            line-height: 1.15;

            font-weight: 750;

            letter-spacing: -0.7px;

            text-shadow:
                0 3px 12px
                rgba(
                    15,
                    23,
                    42,
                    0.15
                );

            animation:
                headerIn
                0.55s
                ease-out;
        }


        .header p {

            margin: 13px 0 0;

            font-size: 15px;

            line-height: 1.6;

            font-weight: 400;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.90
                );

            letter-spacing: 0.2px;

            animation:
                headerIn
                0.7s
                ease-out;
        }


        @keyframes headerIn {

            from {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           MAIN CONTAINER
           ===================================================== */

        .container {

            width: 100%;

            max-width: 1080px;

            margin: 0 auto;

            padding:
                52px 28px 65px;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .title {

            margin: 0 0 34px;

            text-align: center;

            color: #0f172a;

            font-size: 25px;

            line-height: 1.3;

            font-weight: 700;

            letter-spacing: -0.3px;
        }


        .title::after {

            content: "";

            display: block;

            width: 44px;

            height: 3px;

            margin: 13px auto 0;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #38bdf8
                );
        }


        /* =====================================================
           DEPARTMENT GRID
           ===================================================== */

        .departments {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        245px,
                        1fr
                    )
                );

            gap: 18px;
        }


        /* =====================================================
           DEPARTMENT ITEM
           ===================================================== */

        .department {

            position: relative;

            min-height: 112px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px 22px;

            text-align: center;

            text-decoration: none;

            color: #0f172a;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.96
                );

            border:
                1px solid #dbeafe;

            border-radius: 5px;

            font-size: 16px;

            line-height: 1.45;

            font-weight: 650;

            box-shadow:
                0 7px 22px
                rgba(
                    15,
                    23,
                    42,
                    0.055
                );

            overflow: hidden;

            transition:
                transform 0.22s ease,
                border-color 0.22s ease,
                box-shadow 0.22s ease,
                background 0.22s ease,
                color 0.22s ease;
        }


        /* =====================================================
           BLUE SIDE ACCENT
           ===================================================== */

        .department::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 4px;

            height: 100%;

            background:
                linear-gradient(
                    180deg,
                    #2563eb,
                    #38bdf8
                );

            transition:
                width 0.22s ease;
        }


        /* =====================================================
           TOP LIGHT EFFECT
           ===================================================== */

        .department::after {

            content: "";

            position: absolute;

            width: 100px;

            height: 100px;

            top: -55px;

            right: -50px;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        56,
                        189,
                        248,
                        0.16
                    ),
                    transparent 70%
                );

            pointer-events: none;

            transition:
                transform 0.3s ease;
        }


        /* =====================================================
           HOVER
           ===================================================== */

        .department:hover {

            color: #2563eb;

            background: #ffffff;

            border-color: #93c5fd;

            transform:
                translateY(-4px);

            box-shadow:
                0 14px 30px
                rgba(
                    37,
                    99,
                    235,
                    0.12
                );
        }


        .department:hover::before {

            width: 6px;
        }


        .department:hover::after {

            transform:
                scale(1.4);
        }


        /* =====================================================
           ACTIVE
           ===================================================== */

        .department:active {

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 16px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .empty-message {

            width: 100%;

            padding: 35px 20px;

            text-align: center;

            color: #64748b;

            background: #ffffff;

            border:
                1px solid #dbeafe;

            border-radius: 5px;

            box-shadow:
                0 6px 18px
                rgba(
                    15,
                    23,
                    42,
                    0.05
                );
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 768px) {

            .header {

                padding:
                    48px 20px 52px;
            }


            .header h1 {

                font-size: 32px;
            }


            .container {

                padding:
                    42px 22px 55px;
            }


            .title {

                font-size: 23px;

                margin-bottom: 28px;
            }


            .departments {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 15px;
            }


            .department {

                min-height: 105px;

                padding: 20px 16px;
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 560px) {

            .header {

                padding:
                    42px 18px 46px;
            }


            .header h1 {

                font-size: 28px;
            }


            .header p {

                margin-top: 10px;

                font-size: 14px;
            }


            .container {

                padding:
                    34px 16px 45px;
            }


            .title {

                font-size: 21px;

                margin-bottom: 25px;
            }


            .departments {

                grid-template-columns:
                    1fr;

                gap: 13px;
            }


            .department {

                min-height: 88px;

                padding: 18px;

                font-size: 15px;
            }
        }


        /* =====================================================
           SMALL MOBILE
           ===================================================== */

        @media (max-width: 380px) {

            .header {

                padding:
                    36px 15px 40px;
            }


            .header h1 {

                font-size: 25px;
            }


            .header p {

                font-size: 13px;
            }


            .container {

                padding:
                    30px 12px 40px;
            }


            .title {

                font-size: 20px;
            }


            .department {

                min-height: 82px;

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<div class="header">

    <div class="header-content">

        <h1>
            GAC-Pro-I'd
        </h1>

        <p>
            Provisional Identity Card Generation System
        </p>

    </div>

</div>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<div class="container">


    <h2 class="title">

        Select Your Department

    </h2>


    <div class="departments">


        {% for department in departments %}


            <a
                href="{% url 'department_options' department.id %}"
                class="department"
            >

                {{ department.name }}

            </a>


        {% empty %}


            <p class="empty-message">

                No departments available.

            </p>


        {% endfor %}


    </div>


</div>


</body>

</html>
