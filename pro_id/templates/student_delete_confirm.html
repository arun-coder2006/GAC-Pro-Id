<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Confirm Delete - GAC-Pro-I'd
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        :root {
            --primary: #2563EB;
            --secondary: #38BDF8;
            --light-blue: #E0F2FE;
            --background: #F8FBFF;
            --white: #FFFFFF;
            --text: #0F172A;
            --secondary-text: #475569;
            --border: #D8E6F3;
            --danger: #DC2626;
            --danger-dark: #B91C1C;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(56, 189, 248, 0.14),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(37, 99, 235, 0.10),
                    transparent 32%
                ),
                var(--background);

            color: var(--text);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;

            position: relative;

            overflow: hidden;
        }


        /* =========================================
           BACKGROUND DECORATION
        ========================================= */

        body::before {

            content: "";

            position: fixed;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(56, 189, 248, 0.10),
                    rgba(37, 99, 235, 0.06)
                );

            top: -150px;

            right: -100px;

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 250px;

            height: 250px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    rgba(37, 99, 235, 0.07),
                    rgba(56, 189, 248, 0.05)
                );

            bottom: -120px;

            left: -100px;

            pointer-events: none;
        }


        /* =========================================
           MAIN BOX
        ========================================= */

        .box {

            width: 100%;

            max-width: 500px;

            background: rgba(
                255,
                255,
                255,
                0.96
            );

            border: 1px solid var(--border);

            border-radius: 8px;

            padding: 38px 36px;

            text-align: center;

            box-shadow:
                0 18px 45px rgba(
                    15,
                    23,
                    42,
                    0.10
                );

            position: relative;

            z-index: 1;

            animation:
                fadeUp 0.45s ease-out;
        }


        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(14px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================================
           WARNING ICON
        ========================================= */

        .warning-icon {

            width: 64px;

            height: 64px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #FEF2F2,
                    #FFF7F7
                );

            border:
                1px solid #FECACA;

            color: var(--danger);

            font-size: 29px;

            font-weight: 700;
        }


        /* =========================================
           HEADING
        ========================================= */

        h1 {

            margin: 0;

            color: var(--text);

            font-size: 27px;

            font-weight: 750;

            letter-spacing: -0.5px;
        }


        .subtitle {

            margin:

                9px 0 0;

            color: var(--secondary-text);

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================================
           STUDENT INFORMATION
        ========================================= */

        .student {

            margin-top: 27px;

            padding: 19px 20px;

            background:
                linear-gradient(
                    135deg,
                    #F8FBFF,
                    #EFF8FF
                );

            border:

                1px solid var(--border);

            border-left:

                3px solid var(--primary);

            border-radius: 6px;

            text-align: left;
        }


        .student-name {

            color: var(--text);

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 13px;
        }


        .student-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding-top: 10px;

            border-top:
                1px solid #E5EEF7;

            font-size: 14px;
        }


        .student-label {

            color: var(--secondary-text);

            font-weight: 600;
        }


        .student-value {

            color: var(--text);

            font-family:
                "Courier New",
                monospace;

            font-weight: 600;

            text-align: right;

            word-break: break-word;
        }


        /* =========================================
           WARNING MESSAGE
        ========================================= */

        .warning {

            margin-top: 20px;

            padding: 14px 16px;

            background: #FFF7F7;

            border:
                1px solid #FECACA;

            border-radius: 6px;

            color: #991B1B;

            font-size: 13px;

            line-height: 1.6;

            text-align: left;
        }


        .warning strong {

            color: #B91C1C;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-top: 25px;
        }


        button,
        a {

            min-height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 11px 18px;

            border-radius: 6px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            font-family: inherit;
        }


        button {

            border: none;
        }


        /* DELETE */

        .delete {

            background:
                linear-gradient(
                    135deg,
                    var(--danger),
                    #EF4444
                );

            color: white;

            box-shadow:
                0 7px 18px rgba(
                    220,
                    38,
                    38,
                    0.20
                );
        }


        .delete:hover {

            background:
                linear-gradient(
                    135deg,
                    var(--danger-dark),
                    var(--danger)
                );

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 22px rgba(
                    220,
                    38,
                    38,
                    0.25
                );
        }


        /* CANCEL */

        .cancel {

            background: white;

            color: var(--primary);

            border:
                1px solid #BBD4F5;

            box-shadow:
                0 4px 12px rgba(
                    15,
                    23,
                    42,
                    0.05
                );
        }


        .cancel:hover {

            background: var(--light-blue);

            border-color:
                var(--secondary);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 18px rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 560px) {

            body {

                padding: 16px;

                align-items: center;
            }


            .box {

                padding: 30px 22px;

                border-radius: 7px;
            }


            h1 {

                font-size: 23px;
            }


            .warning-icon {

                width: 58px;

                height: 58px;

                font-size: 26px;
            }


            .student {

                padding: 16px;
            }


            .student-row {

                flex-direction: column;

                align-items: flex-start;

                gap: 4px;
            }


            .student-value {

                text-align: left;

                width: 100%;
            }


            .buttons {

                grid-template-columns: 1fr;
            }


            button,
            a {

                width: 100%;
            }
        }


        @media (max-width: 360px) {

            .box {

                padding:
                    26px 17px;
            }


            h1 {

                font-size: 21px;
            }


            .subtitle {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


<div class="box">


    <!-- WARNING ICON -->

    <div class="warning-icon">

        !

    </div>


    <!-- TITLE -->

    <h1>

        Confirm Delete

    </h1>


    <div class="subtitle">

        Please review the student details before continuing.

    </div>


    <!-- STUDENT DETAILS -->

    <div class="student">


        <div class="student-name">

            {{ student.name }}

        </div>


        <div class="student-row">

            <span class="student-label">

                Application Number

            </span>


            <span class="student-value">

                {{ student.student_key }}

            </span>

        </div>


    </div>


    <!-- WARNING -->

    <div class="warning">

        <strong>
            This action cannot be undone.
        </strong>

        <br>

        Deleting this student will permanently remove the
        corresponding record from the system.

    </div>


    <!-- ACTIONS -->

    <form method="POST">

        {% csrf_token %}


        <div class="buttons">


            <button
                type="submit"
                class="delete"
            >

                Yes, Delete

            </button>


           <a
    href="{% url 'admin_year_students' year=student.submission_year %}"
    class="cancel"
>
    Cancel
</a>


        </div>

    </form>


</div>


</body>

</html>
