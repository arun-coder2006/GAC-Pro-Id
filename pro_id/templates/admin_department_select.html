<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Select Department</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #38bdf8;
            --light-blue: #e0f2fe;
            --background: #f8fbff;
            --white: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #dbeafe;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(56, 189, 248, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(37, 99, 235, 0.10),
                    transparent 30%
                ),
                var(--background);

            display: flex;

            flex-direction: column;
        }


        /* =========================================
           HEADER
           ========================================= */

        .header {

            position: relative;

            width: 100%;

            padding: 28px 24px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #1976e8 45%,
                    #38bdf8 100%
                );

            color: white;

            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(
                    37,
                    99,
                    235,
                    0.18
                );
        }


        .header::before {

            content: "";

            position: absolute;

            width: 240px;

            height: 240px;

            border-radius: 50%;

            background: rgba(
                255,
                255,
                255,
                0.10
            );

            top: -130px;

            right: 8%;
        }


        .header::after {

            content: "";

            position: absolute;

            width: 160px;

            height: 160px;

            border-radius: 50%;

            background: rgba(
                255,
                255,
                255,
                0.08
            );

            bottom: -100px;

            left: 12%;
        }


        .header-content {

            position: relative;

            z-index: 2;

            max-width: 1100px;

            margin: auto;

            text-align: center;
        }


        .header h1 {

            margin: 0;

            font-size: clamp(
                25px,
                4vw,
                34px
            );

            font-weight: 800;

            letter-spacing: -0.5px;
        }


        .header p {

            margin: 8px 0 0;

            font-size: 14px;

            color: rgba(
                255,
                255,
                255,
                0.90
            );

            letter-spacing: 0.3px;
        }


        /* =========================================
           MAIN CONTAINER
           ========================================= */

        .container {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding: 55px 25px 45px;

            flex: 1;
        }


        /* =========================================
           PAGE HEADING
           ========================================= */

        .heading {

            text-align: center;

            margin-bottom: 38px;
        }


        .heading h2 {

            margin: 0;

            color: var(--text);

            font-size: clamp(
                25px,
                4vw,
                32px
            );

            font-weight: 800;

            letter-spacing: -0.6px;
        }


        .heading-line {

            width: 58px;

            height: 4px;

            margin: 14px auto 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );
        }


        /* =========================================
           DEPARTMENT GRID
           ========================================= */

        .departments {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        240px,
                        1fr
                    )
                );

            gap: 20px;
        }


        /* =========================================
           DEPARTMENT CARD
           ========================================= */

        .department {

            position: relative;

            min-height: 125px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 14px;

            text-decoration: none;

            color: var(--text);

            font-size: 17px;

            font-weight: 700;

            text-align: center;

            overflow: hidden;

            box-shadow:
                0 8px 25px rgba(
                    15,
                    23,
                    42,
                    0.06
                );

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }


        .department::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );
        }


        .department::after {

            content: "";

            position: absolute;

            width: 90px;

            height: 90px;

            border-radius: 50%;

            background:
                rgba(
                    56,
                    189,
                    248,
                    0.08
                );

            right: -35px;

            bottom: -40px;

            transition:
                transform 0.3s ease;
        }


        .department:hover {

            transform: translateY(-5px);

            border-color:
                rgba(
                    37,
                    99,
                    235,
                    0.35
                );

            box-shadow:
                0 15px 35px rgba(
                    37,
                    99,
                    235,
                    0.14
                );

            color: var(--primary);
        }


        .department:hover::after {

            transform: scale(1.4);
        }


        .department:active {

            transform: translateY(-2px);
        }


        /* =========================================
           EMPTY STATE
           ========================================= */

        .empty {

            grid-column: 1 / -1;

            padding: 30px;

            text-align: center;

            background: white;

            border: 1px solid var(--border);

            color: var(--muted);

            border-radius: 12px;
        }


        /* =========================================
           BACK BUTTON
           ========================================= */

        .back {

            display: block;

            width: fit-content;

            margin: 38px auto 0;

            padding: 11px 22px;

            background: white;

            color: var(--primary);

            border: 1px solid
                rgba(
                    37,
                    99,
                    235,
                    0.25
                );

            border-radius: 8px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .back:hover {

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(
                    37,
                    99,
                    235,
                    0.18
                );
        }


        /* =========================================
           RESPONSIVE
           ========================================= */

        @media (max-width: 700px) {

            .header {

                padding: 24px 18px;
            }


            .container {

                padding:
                    40px 18px
                    35px;
            }


            .heading {

                margin-bottom: 28px;
            }


            .departments {

                grid-template-columns: 1fr;

                gap: 15px;
            }


            .department {

                min-height: 100px;

                font-size: 16px;
            }
        }


        @media (max-width: 400px) {

            .header h1 {

                font-size: 24px;
            }


            .header p {

                font-size: 13px;
            }


            .container {

                padding-left: 14px;

                padding-right: 14px;
            }


            .department {

                min-height: 92px;

                padding: 20px;

                font-size: 15px;
            }


            .back {

                width: 100%;

                text-align: center;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
         ========================================= -->

    <header class="header">

        <div class="header-content">

            <h1>
                GAC-Pro-I'd
            </h1>

            <p>
                Department Admin Login
            </p>

        </div>

    </header>


    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <main class="container">


        <div class="heading">

            <h2>
                Select Your Department
            </h2>

            <div class="heading-line"></div>

        </div>


        <div class="departments">


            {% for department in departments %}


                <a
                    class="department"
                    href="{% url 'admin_login' department.id %}"
                >

                    {{ department.name }}

                </a>


            {% empty %}


                <div class="empty">

                    No departments available.

                </div>


            {% endfor %}


        </div>


        <!-- =========================================
             BACK TO HOME
             ========================================= -->

        <a
            href="{% url 'home' %}"
            class="back"
        >

            ← Back to Home

        </a>


    </main>


</body>

</html>
