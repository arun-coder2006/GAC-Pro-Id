<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GAC-Pro-I'd</title>


    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        :root {

            --primary: #2563eb;
            --primary-dark: #1d4ed8;

            --secondary: #38bdf8;

            --light-blue: #e0f2fe;

            --background: #f8fbff;

            --white: #ffffff;

            --text: #0f172a;

            --secondary-text: #475569;

            --border: #dbeafe;

        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 90% 0%,
                    rgba(56, 189, 248, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(37, 99, 235, 0.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eef7ff 50%,
                    #f8fbff 100%
                );

            display: flex;

            flex-direction: column;

        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {

            position: relative;

            overflow: hidden;

            padding: 28px 20px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #38bdf8
                );

            color: white;

            box-shadow:
                0 8px 30px
                rgba(
                    37,
                    99,
                    235,
                    0.18
                );
        }


        .header::before {

            content: "";

            position: absolute;

            width: 220px;

            height: 220px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            top: -150px;

            left: 8%;

        }


        .header::after {

            content: "";

            position: absolute;

            width: 260px;

            height: 260px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            right: 5%;

            bottom: -210px;

        }


        .header h1 {

            position: relative;

            z-index: 1;

            margin: 0;

            font-size: 29px;

            font-weight: 800;

            letter-spacing: -0.5px;
        }


        .header p {

            position: relative;

            z-index: 1;

            margin: 8px 0 0;

            font-size: 14px;

            opacity: 0.92;

            letter-spacing: 0.2px;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .container {

            width: 100%;

            max-width: 760px;

            margin: auto;

            padding: 65px 25px 80px;

            text-align: center;
        }


        /* =========================================================
           DEPARTMENT
        ========================================================= */

        .department {

            display: inline-block;

            margin-bottom: 42px;

            padding: 12px 24px;

            background:
                rgba(
                    224,
                    242,
                    254,
                    0.85
                );

            border: 1px solid #bfdbfe;

            color: var(--primary);

            font-size: 25px;

            font-weight: 800;

            letter-spacing: -0.3px;

            box-shadow:
                0 6px 20px
                rgba(
                    37,
                    99,
                    235,
                    0.07
                );
        }


        /* =========================================================
           OPTIONS
        ========================================================= */

        .options {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 22px;

            width: 100%;
        }


        /* =========================================================
           OPTION BUTTON
        ========================================================= */

        .button {

            position: relative;

            overflow: hidden;

            min-height: 145px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            background: var(--white);

            border: 1px solid var(--border);

            color: var(--primary);

            text-decoration: none;

            font-size: 19px;

            font-weight: 750;

            box-shadow:
                0 8px 28px
                rgba(
                    15,
                    23,
                    42,
                    0.07
                );

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease,
                color 0.22s ease;

        }


        .button::before {

            content: "";

            position: absolute;

            left: 0;

            top: 0;

            width: 100%;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );

        }


        .button::after {

            content: "";

            position: absolute;

            width: 160px;

            height: 160px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        56,
                        189,
                        248,
                        0.12
                    ),
                    transparent 70%
                );

            right: -90px;

            bottom: -100px;

            transition:
                transform 0.3s ease;
        }


        .button:hover {

            transform:
                translateY(-5px);

            border-color:
                #93c5fd;

            color:
                var(--primary-dark);

            box-shadow:
                0 16px 38px
                rgba(
                    37,
                    99,
                    235,
                    0.14
                );
        }


        .button:hover::after {

            transform:
                scale(1.25);
        }


        .button:active {

            transform:
                translateY(-1px);
        }


        /* =========================================================
           SMALL ACCENT
        ========================================================= */

        .button span {

            position: relative;

            z-index: 2;
        }


        .button .arrow {

            margin-top: 10px;

            font-size: 17px;

            opacity: 0;

            transform:
                translateX(-6px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .button:hover .arrow {

            opacity: 1;

            transform:
                translateX(0);
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 650px) {

            .header {

                padding:
                    24px 15px;
            }


            .header h1 {

                font-size: 24px;
            }


            .header p {

                font-size: 12px;

                line-height: 1.5;
            }


            .container {

                padding:
                    45px 18px 60px;
            }


            .department {

                margin-bottom: 30px;

                font-size: 20px;

                padding:
                    10px 18px;
            }


            .options {

                grid-template-columns: 1fr;

                gap: 15px;
            }


            .button {

                min-height: 120px;

                font-size: 17px;
            }


            .button .arrow {

                opacity: 1;

                transform:
                    translateX(0);
            }

        }


        @media (max-width: 380px) {

            .header h1 {

                font-size: 21px;
            }


            .container {

                padding-left: 14px;

                padding-right: 14px;
            }


            .department {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         HEADER
    ========================================================== -->

    <div class="header">

        <h1>
            GAC-Pro-I'd
        </h1>

        <p>
            Provisional Identity Card Generation System
        </p>

    </div>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <div class="container">


        <div class="department">

            {{ department.name }}

        </div>


        <div class="options">


            <!-- =================================================
                 STUDENT LOGIN
            ================================================== -->

            <a
                href="{% url 'student_login' department.id %}"
                class="button"
            >

                <span>
                    Student Login
                </span>

                <span class="arrow">
                    →
                </span>

            </a>


            <!-- =================================================
                 ADMIN LOGIN
            ================================================== -->

            <a
                href="{% url 'admin_login' department.id %}"
                class="button"
            >

                <span>
                    Admin Login
                </span>

                <span class="arrow">
                    →
                </span>

            </a>


        </div>


    </div>


</body>

</html>
