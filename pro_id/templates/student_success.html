<!DOCTYPE html>
<html lang="en">

<head>

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Submitted - GAC-Pro-I'd</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px 18px;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: #0f172a;

            background:
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eef7ff 48%,
                    #e0f2fe 100%
                );
        }


        /* ==================================================
           MAIN CONTAINER
           ================================================== */

        .box {

            width: 100%;

            max-width: 520px;

            background: #ffffff;

            border: 1px solid #dbeafe;

            border-radius: 4px;

            box-shadow:
                0 18px 45px rgba(
                    15,
                    23,
                    42,
                    0.10
                );

            overflow: hidden;

            position: relative;
        }


        /* ==================================================
           TOP ACCENT
           ================================================== */

        .top-accent {

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #38bdf8
                );
        }


        /* ==================================================
           HEADER
           ================================================== */

        .header {

            padding: 30px 34px 24px;

            border-bottom: 1px solid #e5edf7;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #fafdff 100%
                );

            text-align: left;
        }


        .header-label {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 12px;

            color: #2563eb;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .header-label::before {

            content: "";

            width: 24px;

            height: 2px;

            background: #2563eb;
        }


        h1 {

            margin: 0;

            color: #0f172a;

            font-size: 28px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing: -0.5px;
        }


        .subtitle {

            margin-top: 8px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ==================================================
           CONTENT
           ================================================== */

        .content {

            padding: 28px 34px 32px;
        }


        /* ==================================================
           SUCCESS STATUS
           ================================================== */

        .status {

            display: flex;

            align-items: center;

            gap: 14px;

            padding: 16px 18px;

            border: 1px solid #bbf7d0;

            border-left: 4px solid #16a34a;

            background:
                linear-gradient(
                    100deg,
                    #f0fdf4,
                    #f8fff9
                );

            border-radius: 3px;

            margin-bottom: 22px;
        }


        .status-icon {

            width: 34px;

            height: 34px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #16a34a;

            color: #ffffff;

            font-size: 18px;

            font-weight: 700;
        }


        .status-text {

            color: #166534;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.5;
        }


        /* ==================================================
           INFORMATION BOX
           ================================================== */

        .info {

            border: 1px solid #dbeafe;

            background: #f8fbff;

            border-radius: 3px;

            overflow: hidden;
        }


        .info-title {

            padding: 12px 16px;

            background: #eff6ff;

            border-bottom: 1px solid #dbeafe;

            color: #1e3a8a;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.7px;

            text-transform: uppercase;
        }


        .info-row {

            display: grid;

            grid-template-columns: 145px 1fr;

            min-height: 48px;

            align-items: center;

            border-bottom: 1px solid #e5edf7;
        }


        .info-row:last-child {

            border-bottom: none;
        }


        .label {

            padding: 12px 16px;

            color: #64748b;

            font-size: 13px;

            font-weight: 600;
        }


        .value {

            padding: 12px 16px;

            color: #0f172a;

            font-size: 14px;

            font-weight: 600;

            word-break: break-word;
        }


        /* ==================================================
           NOTICE
           ================================================== */

        .notice {

            margin-top: 18px;

            padding: 14px 16px;

            border: 1px solid #e2e8f0;

            border-left: 3px solid #64748b;

            background: #f8fafc;

            color: #64748b;

            font-size: 12px;

            line-height: 1.6;

            border-radius: 3px;
        }


        /* ==================================================
           HOME BUTTON
           ================================================== */

        .home-btn {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            min-height: 52px;

            margin-top: 24px;

            padding: 14px 20px;

            border: none;

            border-radius: 3px;

            background:
                linear-gradient(
                    100deg,
                    #2563eb,
                    #0ea5e9
                );

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 0.2px;

            box-shadow:
                0 8px 18px rgba(
                    37,
                    99,
                    235,
                    0.20
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }


        .home-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 24px rgba(
                    37,
                    99,
                    235,
                    0.28
                );

            filter: brightness(1.03);
        }


        .home-btn:active {

            transform: translateY(0);

            box-shadow:
                0 5px 12px rgba(
                    37,
                    99,
                    235,
                    0.18
                );
        }


        .home-icon {

            margin-right: 9px;

            font-size: 17px;
        }


        /* ==================================================
           RESPONSIVE
           ================================================== */

        @media (max-width: 600px) {

            body {

                padding: 18px 12px;

                align-items: center;
            }


            .box {

                max-width: 100%;
            }


            .header {

                padding: 25px 22px 21px;
            }


            .content {

                padding: 22px 22px 25px;
            }


            h1 {

                font-size: 24px;
            }


            .info-row {

                grid-template-columns: 125px 1fr;
            }


            .label,
            .value {

                padding: 11px 12px;
            }

        }


        @media (max-width: 400px) {

            .header {

                padding: 22px 18px 19px;
            }


            .content {

                padding: 19px 18px 22px;
            }


            .info-row {

                grid-template-columns: 110px 1fr;
            }


            .label,
            .value {

                font-size: 12px;
            }


            .value {

                font-size: 13px;
            }


            .status {

                padding: 14px;
            }

        }

    </style>

</head>


<body>


<div class="box">


    <!-- ==================================================
         TOP ACCENT
         ================================================== -->

    <div class="top-accent"></div>


    <!-- ==================================================
         HEADER
         ================================================== -->

    <div class="header">

        <div class="header-label">

            Student Portal

        </div>


        <h1>

            Details Submitted

        </h1>


        <div class="subtitle">

            Your provisional ID card details have been successfully submitted.

        </div>

    </div>


    <!-- ==================================================
         CONTENT
         ================================================== -->

    <div class="content">


        <!-- ==============================================
             SUCCESS MESSAGE
             ============================================== -->

        <div class="status">

            <div class="status-icon">

                ✓

            </div>


            <div class="status-text">

                Your provisional ID card details have been
                successfully submitted.

            </div>

        </div>


        <!-- ==============================================
             DEPARTMENT INFORMATION
             ============================================== -->

        <div class="info">


            <div class="info-title">

                Submission Information

            </div>


            <div class="info-row">

                <div class="label">

                    Department

                </div>


                <div class="value">

                    {{ department.name }}

                </div>

            </div>


        </div>


        <!-- ==============================================
             NOTICE
             ============================================== -->

        <div class="notice">

            You cannot download the PDF from the student page.

        </div>


        <!-- ==============================================
             HOME
             ============================================== -->

        <a
            href="{% url 'home' %}"
            class="home-btn"
        >

            <span class="home-icon">
                ←
            </span>

            Go to Home

        </a>


    </div>


</div>


</body>

</html>
